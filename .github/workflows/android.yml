name: Build Android APK

# Builds the Ramadan app into an installable Android APK (debug build,
# signed with the debug key — fine for installing on your own phone).
# Run it from the Actions tab ("Run workflow"), or it runs automatically
# on every push to main. The finished APK appears under the run's
# "Artifacts" section as `ramadan-app-apk`, AND is also published as a
# downloadable asset on the `apk-latest` GitHub Release (repo page →
# Releases → "রমজান অ্যাপ — সর্বশেষ APK" → app-debug.apk), so the APK
# can be grabbed straight from the Releases page without opening the
# Actions run. Every new build replaces the APK on that release.
#
# What it does:
#   1. installs the project dependencies (Bun),
#   2. builds the web bundle into client/dist,
#   3. creates the Capacitor Android project (first run) and syncs the
#      web bundle + plugins into it,
#   4. makes sure the exact-alarm permission is in AndroidManifest.xml
#      (needed so the Sehri alarm / hadith notifications fire on the
#      exact minute on Android 12+),
#   5. compiles the debug APK with Gradle and uploads it as an artifact.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    # Needed so the release step below can create/update the GitHub
    # Release and upload the APK asset to it.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: |
          # The space SDK ships as a local file: dependency pointing at a
          # path that only exists on the build machine where the app was
          # authored. A vendored copy (space-sdk.tgz) sits at the repo root
          # for CI — point package.json at it, and drop the lockfile (its
          # format is newer than the runner's Bun, and it records the old
          # absolute path anyway).
          sed -i 's|file:/opt/hatch/skills/spaces/ts-runtime/dist/space-sdk.tgz|file:./space-sdk.tgz|' package.json
          rm -f bun.lock
          bun install
      - name: Make the Tailwind Oxide bundler binary executable
        # bun-plugin-tailwind's published tarball ships its native
        # tailwindcss-oxide *.node binaries without the execute bit, so
        # Bun cannot load the bundler's Tailwind plugin in CI and the
        # web build fails with a permission error. Restore +x on them.
        run: find node_modules -name "tailwindcss-oxide*.node" -exec chmod +x {} +
      - name: Build the web bundle
        env:
          HATCH_SPACES_BUILD_DRIVER: "1"
        run: bun run build:client

      - name: Add the Android project (first run only)
        run: |
          if [ ! -d android ]; then
            bunx cap add android
          fi

      - name: Sync web bundle and plugins into Android
        run: bunx cap sync android

      - name: Ensure exact-alarm permission in AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          if ! grep -q "SCHEDULE_EXACT_ALARM" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <application|' "$MANIFEST"
          fi
          grep -n "SCHEDULE_EXACT_ALARM" "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ramadan-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Publish the same APK on the repo's `apk-latest` GitHub Release so
      # it can be downloaded directly from the Releases page (a stable
      # link) instead of only from the expiring Actions artifact. The
      # release is created on the first run and reused after that; each
      # build overwrites the APK asset with the newest one.
      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: রমজান অ্যাপ — সর্বশেষ APK
          body: |
            রমজান অ্যাপের সর্বশেষ Android APK (debug build)।
            নিচের **app-debug.apk** ফাইলটি ডাউনলোড করে ফোনে ইনস্টল করুন।
            প্রতিটি নতুন বিল্ডে এই রিলিজের APK-টি নিজে থেকে হালনাগাদ হয়ে যায়।
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
